<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Patrol</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #17202a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
      color: #cfd8dc;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
      font-size: 17px;
      cursor: pointer;
      background: #1f618d;
      color: white;
    }

    .btn:hover {
      opacity: .9;
    }

    .hidden {
      display: none;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .back {
      background: #616161;
    }

    .required {
      color: #d32f2f;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }

    .report {
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .report strong {
      color: #17202a;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .danger {
      color: #c62828;
      font-weight: bold;
    }

    .good {
      color: #2e7d32;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>تقرير مرور</h1>
    <p>Security Patrol</p>
  </div>

  <div class="container">

    <!-- الصفحة الرئيسية -->
    <div id="home">

      <div class="card">
        <h2>اختيار المستخدم</h2>

        <button class="btn" onclick="openPage('supervisor')">
          القائم بالمرور التعقبي
        </button>

        <button class="btn" onclick="openPage('unit')">
         مدير إداره الخدمات الخارجيه 
        </button>

        <button class="btn" onclick="openPage('control')">
         رئيس قسم الخدمات الخارجيه  
        </button>
      </div>

    </div>


    <!-- المشرف -->
    <div id="supervisor" class="hidden">

      <div class="card">

        <h2>تقرير مرور المشرف</h2>

        <label>
          اسم المشرف <span class="required">*</span>
        </label>

        <input id="supervisorName" type="text"
               placeholder="اكتب اسم المشرف">

        <label>
          نقطة الحراسة <span class="required">*</span>
        </label>

        <input id="guardPoint" type="text"
               placeholder="اسم أو رقم نقطة الحراسة">

        <label>
          حالة الأقماع المرورية <span class="required">*</span>
        </label>

        <select id="cones">
          <option value="">اختر الحالة</option>
          <option>سليمة</option>
          <option>تحتاج صيانة</option>
          <option>غير موجودة</option>
        </select>

        <label>
          حالة الزي <span class="required">*</span>
        </label>

        <select id="uniform">
          <option value="">اختر الحالة</option>
          <option>مطابق</option>
          <option>غير مطابق</option>
          <option>يحتاج تغيير</option>
        </select>

        <label>
          حالة التجهيزات <span class="required">*</span>
        </label>

        <select id="equipment">
          <option value="">اختر الحالة</option>
          <option>سليمة</option>
          <option>يوجد نقص</option>
          <option>تحتاج صيانة</option>
        </select>

        <label>
          الملاحظات <span class="required">*</span>
        </label>

        <textarea id="notes"
          placeholder="يجب كتابة الملاحظات بالتفصيل"></textarea>

        <button class="btn" onclick="submitReport()">
          إرسال التقرير
        </button>

        <div id="success" class="success">
          تم إرسال التقرير بنجاح
        </div>

        <button class="btn back" onclick="goHome()">
          العودة
        </button>

      </div>

    </div>


    <!-- رئيس وحدة العمليات -->
    <div id="unit" class="hidden">

      <div class="card">

        <h2>تقارير المشرفين</h2>

        <div id="unitReports"></div>

        <button class="btn" onclick="loadReports('unitReports')">
          تحديث التقارير
        </button>

        <button class="btn back" onclick="goHome()">
          العودة
        </button>

      </div>

    </div>


    <!-- غرفة العمليات الرئيسية -->
    <div id="control" class="hidden">

      <div class="card">

        <h2>التقارير المركزية</h2>

        <div id="controlReports"></div>

        <button class="btn" onclick="loadReports('controlReports')">
          تحديث التقارير
        </button>

        <button class="btn back" onclick="goHome()">
          العودة
        </button>

      </div>

    </div>

  </div>


  <script>

    function openPage(page) {

      document.getElementById("home").classList.add("hidden");
      document.getElementById("supervisor").classList.add("hidden");
      document.getElementById("unit").classList.add("hidden");
      document.getElementById("control").classList.add("hidden");

      document.getElementById(page).classList.remove("hidden");

      if (page === "unit") {
        loadReports("unitReports");
      }

      if (page === "control") {
        loadReports("controlReports");
      }
    }


    function goHome() {

      document.getElementById("home").classList.remove("hidden");
      document.getElementById("supervisor").classList.add("hidden");
      document.getElementById("unit").classList.add("hidden");
      document.getElementById("control").classList.add("hidden");
    }


    function submitReport() {

      const name =
        document.getElementById("supervisorName").value.trim();

      const point =
        document.getElementById("guardPoint").value.trim();

      const cones =
        document.getElementById("cones").value;

      const uniform =
        document.getElementById("uniform").value;

      const equipment =
        document.getElementById("equipment").value;

      const notes =
        document.getElementById("notes").value.trim();


      if (!name || !point || !cones || !uniform || !equipment || !notes) {

        alert("من فضلك أكمل جميع البيانات، والملاحظات إجبارية.");

        return;
      }


      const report = {

        id: Date.now(),

        supervisorName: name,

        guardPoint: point,

        cones: cones,

        uniform: uniform,

        equipment: equipment,

        notes: notes,

        date: new Date().toLocaleString("ar-EG")

      };


      let reports =
        JSON.parse(localStorage.getItem("securityReports")) || [];


      reports.push(report);


      localStorage.setItem(
        "securityReports",
        JSON.stringify(reports)
      );


      document.getElementById("success").style.display = "block";

      alert("تم إرسال التقرير بنجاح");

      
      document.getElementById("supervisorName").value = "";
      document.getElementById("guardPoint").value = "";
      document.getElementById("cones").value = "";
      document.getElementById("uniform").value = "";
      document.getElementById("equipment").value = "";
      document.getElementById("notes").value = "";
    }


    function loadReports(containerId) {

      const container =
        document.getElementById(containerId);


      let reports =
        JSON.parse(localStorage.getItem("securityReports")) || [];


      if (reports.length === 0) {

        container.innerHTML =
          '<div class="empty">لا توجد تقارير حتى الآن</div>';

        return;
      }


      reports.sort((a, b) => b.id - a.id);


      container.innerHTML = "";


      reports.forEach(report => {

        const div = document.createElement("div");

        div.className = "report";


        div.innerHTML = `

          <div>
            <strong>اسم المشرف:</strong>
            ${escapeHTML(report.supervisorName)}
          </div>

          <div>
            <strong>نقطة الحراسة:</strong>
            ${escapeHTML(report.guardPoint)}
          </div>

          <div>
            <strong>حالة الأقماع:</strong>
            ${escapeHTML(report.cones)}
          </div>

          <div>
            <strong>حالة الزي:</strong>
            ${escapeHTML(report.uniform)}
          </div>

          <div>
            <strong>حالة التجهيزات:</strong>
            ${escapeHTML(report.equipment)}
          </div>

          <div>
            <strong>الملاحظات:</strong>
            ${escapeHTML(report.notes)}
          </div>

          <div>
            <strong>التاريخ والوقت:</strong>
            ${escapeHTML(report.date)}
          </div>

        `;


        container.appendChild(div);

      });

    }


    function escapeHTML(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
