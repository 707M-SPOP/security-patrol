<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Patrol</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #17202a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
      color: #cfd8dc;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
      font-size: 17px;
      cursor: pointer;
      background: #1f618d;
      color: white;
    }

    .btn:hover {
      opacity: .9;
    }

    .hidden {
      display: none;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .back {
      background: #616161;
    }

    .required {
      color: #d32f2f;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>نظام التفتيش الميداني</h1>
    <p>Security Patrol</p>
  </div>

  <div class="container">

    <!-- الصفحة الرئيسية -->
    <div id="home">

      <div class="card">
        <h2>اختيار المستخدم</h2>

        <button class="btn" onclick="openPage('supervisor')">
          المشرف
        </button>

        <button class="btn" onclick="openPage('unit')">
          رئيس وحدة العمليات
        </button>

        <button class="btn" onclick="openPage('control')">
          غرفة العمليات الرئيسية
        </button>
      </div>

    </div>


    <!-- المشرف -->
    <div id="supervisor" class="hidden">

      <div class="card">

        <h2>تقرير مرور المشرف</h2>

        <label>
          اسم المشرف <span class="required">*</span>
        </label>

        <input id="supervisorName" type="text"
               placeholder="اكتب اسم المشرف">

        <label>
          نقطة الحراسة <span class="required">*</span>
        </label>

        <input id="guardPoint" type="text"
               placeholder="اسم أو رقم نقطة الحراسة">

        <label>
          حالة الأقماع المرورية <span class="required">*</span>
        </label>

        <select id="cones">
          <option value="">اختر الحالة</option>
          <option>سليمة</option>
          <option>تحتاج صيانة</option>
          <option>غير موجودة</option>
        </select>

        <label>
          حالة الزي <span class="required">*</span>
        </label>

        <select id="uniform">
          <option value="">اختر الحالة</option>
          <option>مطابق</option>
          <option>غير مطابق</option>
          <option>يحتاج تغيير</option>
        </select>

        <label>
          حالة التجهيزات <span class="required">*</span>
        </label>

        <select id="equipment">
          <option value="">اختر الحالة</option>
          <option>سليمة</option>
          <option>يوجد نقص</option>
          <option>تحتاج صيانة</option>
        </select>

        <label>
          الملاحظات <span class="required">*</span>
        </label>

        <textarea id="notes"
          placeholder="يجب كتابة الملاحظات بالتفصيل"></textarea>

        <button class="btn" onclick="submitReport()">
          إرسال التقرير
        </button>

        <div id="success" class="success">
          تم إرسال التقرير بنجاح
        </div>

        <button class="btn back" onclick="goHome()">
          العودة
        </button>

      </div>

    </div>
